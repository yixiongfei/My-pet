# ---------- 收礼：用户送的，不花她的钱 ----------
# 走 give_gift 命令触发（托盘菜单），不进 decide 的自动挑选——
# 礼物是「别人给的」，她自己不会凭空收到一个

[[action]]
id = "gift"
name = "收礼物"
activity = "gift"
graph = "gift"
tags = ["gift"]
duration = 3
cooldown = 0
per_min = { strength = 0.2, hunger = 0.0, thirst = 0.0, feeling = 0.0 }
lines = ["送给我的「{food}」吗？谢谢你，我很喜欢！", "哇，{food}！你怎么知道我想要这个。", "谢谢你的{food}，我会好好珍惜的。"]
